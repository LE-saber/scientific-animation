<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>科研动画项目模板（示例数据，须按真实项目重构）</title>
<style>
:root{color-scheme:light;--bg:#f5f5f3;--ink:#242424;--line:#d3d3d0;--accent:#c45e34}
*{box-sizing:border-box}body{background:var(--bg);color:var(--ink);margin:0;font:15px/1.5 "Microsoft YaHei",sans-serif}
main{max-width:1420px;margin:auto;padding:16px;display:grid;gap:10px}
header{display:flex;justify-content:space-between;align-items:baseline;gap:14px;flex-wrap:wrap}
header strong{font:normal 25px/1.25 "STZhongsong","Noto Serif CJK SC",serif}
header small{color:#747474}canvas{display:block;width:100%;aspect-ratio:16/9;background:#f5f5f3;border:1px solid var(--line)}
.controls{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
button,select{background:#fff;color:var(--ink);border:1px solid #c5c5c2;border-radius:5px;padding:7px 12px;font:inherit;cursor:pointer}
button:hover{border-color:var(--accent)}input[type=range]{flex:1;min-width:140px;accent-color:var(--accent)}label{white-space:nowrap}
.note{margin:0;color:#666;font-size:13px}
</style>
</head>
<body>
<main>
  <header><strong>算法运动图解 · 运行模板</strong><small>示例数据，不代表真实项目的实验结果</small></header>
  <canvas id="film" width="1280" height="720" aria-label="可以播放的科研动画模板"></canvas>
  <div class="controls">
    <button id="play">暂停</button><button id="restart">重播</button>
    <input id="seek" type="range" min="0" max="18" step="0.01" value="0" aria-label="播放进度">
    <span id="clock">00:00 / 00:18</span>
    <label><input type="checkbox" id="captions" checked> 解说字幕</label>
    <label>速度 <select id="speed"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="1.5">1.5×</option><option value="2">2×</option></select></label>
    <button id="full">全屏</button>
  </div>
  <p class="note">这是展示真实动效与播放器功能的最小工程，并非成片。制作正式作品时，要替换下方 DEMO 任务、路径、时间轴、字幕与镜头运动，先核对数据再渲染。</p>
</main>
<script>
"use strict";
// Replace this illustrative DEMO object with verified project data.
const DEMO={
  duration:18, robots:[{id:"R1",pos:[1,2]},{id:"R2",pos:[1,7]}],
  buffers:[{id:"B1",pos:[4,3]},{id:"B2",pos:[8,6]}],
  shelves:[{x:4,y:2,w:2,h:3},{x:8,y:5,w:2,h:3}],
  stations:[[12,3],[12,7]],
  // Each route is generated from a four-neighbour, rack-passable grid.
  captions:[
    {from:0,to:6,text:"飞梯把货物送到底部缓存区，货运机器人从架下接货。"},
    {from:6,to:12,text:"路径距离形成成本矩阵，整体匹配决定谁来接哪一单。"},
    {from:12,to:18,text:"机器人完成任务后，系统更新位置，再触发下一轮分配。"}
  ]
};
const W=1280,H=720,canvas=document.querySelector("#film"),ctx=canvas.getContext("2d");
const state={t:0,playing:true,last:0,rate:1};
const clamp=(v,a=0,b=1)=>Math.min(b,Math.max(a,v));
const ease=v=>{v=clamp(v);return v*v*(3-2*v)};
const seg=(t,a,b)=>ease((t-a)/(b-a));
const mix=(a,b,p)=>a+(b-a)*p;
const ink="#252525",dim="#777",accent="#c45e34",pale="#e2dfda",ox=100,oy=95,s=42;
function xy(p){return [ox+(p[0]+.5)*s,oy+(p[1]+.5)*s]}
function text(s,x,y,size=26,color=ink,align="left",family="Microsoft YaHei",weight=700){ctx.font=`${weight} ${size}px "${family}",sans-serif`;ctx.textBaseline="middle";ctx.fillStyle=color;ctx.textAlign=align;ctx.fillText(s,x,y)}
function box(x,y,w,h,fill,stroke){ctx.fillStyle=fill;ctx.fillRect(x,y,w,h);if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=2;ctx.strokeRect(x,y,w,h)}}
function linePath(points,amount,color=accent,width=4){if(points.length<2)return;let steps=clamp(amount)*(points.length-1),idx=Math.floor(steps);ctx.strokeStyle=color;ctx.lineWidth=width;ctx.lineCap="round";ctx.lineJoin="round";ctx.beginPath();points.forEach((p,i)=>{if(i>idx)return;const [x,y]=xy(p);i?ctx.lineTo(x,y):ctx.moveTo(x,y)});if(idx<points.length-1){const a=points[idx],b=points[idx+1];const p=steps-idx;ctx.lineTo(...xy([mix(a[0],b[0],p),mix(a[1],b[1],p)]))}ctx.stroke()}
function route(a,b){const p=[a.slice()];let [x,y]=a;while(x!==b[0]){x+=Math.sign(b[0]-x);p.push([x,y])}while(y!==b[1]){y+=Math.sign(b[1]-y);p.push([x,y])}return p}
const paths=DEMO.robots.map(r=>DEMO.buffers.map(t=>route(r.pos,t.pos)));
const matrix=paths.map(row=>row.map(p=>p.length-1));
function scene(t){
 ctx.fillStyle="#f5f5f3";ctx.fillRect(0,0,W,H);
 // Warehouse, seen from directly above. Shaded lift *projections* remain passable.
 box(ox,oy,14*s,10*s,"#fff","#aaa");ctx.strokeStyle="#ddd";ctx.lineWidth=1;
 for(let x=1;x<14;x++){ctx.beginPath();ctx.moveTo(ox+x*s,oy);ctx.lineTo(ox+x*s,oy+10*s);ctx.stroke()}
 for(let y=1;y<10;y++){ctx.beginPath();ctx.moveTo(ox,oy+y*s);ctx.lineTo(ox+14*s,oy+y*s);ctx.stroke()}
 for(const f of DEMO.shelves){
  ctx.setLineDash([7,5]);ctx.strokeStyle="#999";ctx.lineWidth=2;
  ctx.strokeRect(ox+f.x*s+3,oy+f.y*s+3,f.w*s-6,f.h*s-6);ctx.setLineDash([]);
  box(ox+f.x*s+5,oy+f.y*s+5,f.w*s-10,f.h*s-10,"rgba(40,40,40,.045)",null);
 }
 for(const t0 of DEMO.buffers){let [x,y]=xy(t0.pos);ctx.strokeStyle="#ad5b3c";ctx.lineWidth=2;ctx.strokeRect(x-14,y-14,28,28);text(t0.id,x,y-30,19,ink,"center")}
 for(const p of DEMO.stations){let [x,y]=xy(p);box(x-16,y-16,32,32,"#dededb","#555")}
 const drawRobot=(r,p,loaded=false)=>{const [x,y]=xy(p);box(x-18,y-16,36,32,loaded?accent:ink,null);text(r.id.slice(-1),x,y+2,20,"#fff","center")};
 if(t<6){
  text("架下交接",815,157,44,ink,"left","STZhongsong",400);
  text("飞梯底部缓存",815,217,28,dim);
  const p=seg(t,2,5);linePath(paths[0][0],p,accent,5);
  let r=paths[0][0][Math.floor(p*(paths[0][0].length-1))];drawRobot(DEMO.robots[0],r);
  drawRobot(DEMO.robots[1],DEMO.robots[1].pos);
  let [x,y]=xy(DEMO.buffers[0].pos);box(x-7,y-7,14,14,accent,null);
 } else if(t<12){
  text("距离 → 成本",810,145,42,ink,"left","STZhongsong",400);
  text("R1        R2",817,236,23,dim);
  const p=seg(t,6.2,8.4);
  paths.forEach((row,i)=>row.forEach((r,j)=>linePath(r,p, i===j?accent:"#a3a3a3",i===j?4:2)));
  DEMO.robots.forEach(r=>drawRobot(r,r.pos));
  for(let i=0;i<2;i++)for(let j=0;j<2;j++){
    box(814+j*133,287+i*87,117,72,i===j?"#f1ddd5":"#fafaf9",i===j?accent:"#c8c8c8");
    text(String(matrix[i][j]),871+j*133,323+i*87,37,i===j?accent:ink,"center");
  }
  text("匹配代价  "+String(matrix[0][0]+matrix[1][1]),815,515,29,accent);
 } else {
  text("按事件滚动更新",801,160,38,ink,"left","STZhongsong",400);
  text("完成 → 空闲 → 下一轮",801,222,25,dim);
  const q=seg(t,12,15.5);
  DEMO.robots.forEach((r,i)=>{
    let p=paths[i][i],last=p[p.length-1];
    linePath(p,q,i===0?accent:ink,4);
    const at=p[Math.floor(q*(p.length-1))];drawRobot(r,at,q>.90);
    if(q>.99){let [x,y]=xy(last);ctx.strokeStyle=accent;ctx.lineWidth=3;ctx.beginPath();ctx.arc(x,y,27,0,2*Math.PI);ctx.stroke()}
  });
  text("任务就绪时再判断是否派工",801,295,23,dim);
 }
 if(document.querySelector("#captions").checked){
   let c=DEMO.captions.find(v=>t>=v.from&&t<v.to);
   if(c){box(0,613,W,107,"#f5f5f3",null);text(c.text,W/2,662,29,ink,"center","Microsoft YaHei",700)}
 }
}
function render(){scene(state.t);document.querySelector("#seek").value=state.t;const fmt=s=>`00:${String(Math.floor(s)).padStart(2,"0")}`;document.querySelector("#clock").textContent=`${fmt(state.t)} / ${fmt(DEMO.duration)}`}
function step(now){let dt=state.last?Math.min(.15,(now-state.last)/1000):0;state.last=now;if(state.playing){state.t+=dt*state.rate;if(state.t>=DEMO.duration){state.t=DEMO.duration-.00001;state.playing=false;document.querySelector("#play").textContent="播放"}}render();requestAnimationFrame(step)}
document.querySelector("#play").onclick=()=>{if(state.t>=DEMO.duration-.001)state.t=0;state.playing=!state.playing;document.querySelector("#play").textContent=state.playing?"暂停":"播放"};
document.querySelector("#restart").onclick=()=>{state.t=0;state.playing=true;document.querySelector("#play").textContent="暂停"};
document.querySelector("#seek").oninput=e=>{state.t=+e.target.value;render()};
document.querySelector("#speed").onchange=e=>{state.rate=+e.target.value};
document.querySelector("#captions").onchange=render;
document.querySelector("#full").onclick=()=>canvas.requestFullscreen?.();
render();requestAnimationFrame(step);
</script>
</body>
</html>
